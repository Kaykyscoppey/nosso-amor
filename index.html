<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts para uma tipografia elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
   
    <main class="question-screen">
        <section class="question-card">
            <p>Uma pergunta para você</p>
            <h1>Ela disse sim ?</h1>

            <button id="sim" type="button">Sim</button>
            <button id="nao" type="button">Não</button>
            <p id="mensagem"></p>
        </section>
    </main>

    <main class="senha-screen" id="senhaScreen">
        <section class="senha-card">
            <h1>Agora falta ultima coisa</h1>
            <p>Digite a senha para acessar o site</p>
            <input 
            id="campoSenha"
            type="password"
            placeholder="Digite a senha">

            <button id="botaoSenha" type="button">
                Continuar
            </button>

            <p id="mensagemSenha"></p>
        </section>
    </main>

    

<main class="page-content">
    <h1>Tempo Juntos</h1>
    <div class="contador"> 
        </div>
</main>
    <!-- Cabeçalho / Capa -->

    <script>
        const telaPergunta = document.querySelector('.question-screen');
        const telaSenha = document.querySelector('.senha-screen');
        const botaoSim = document.querySelector('#sim');
        const botaoNao = document.querySelector('#nao');
        const botaoSenha = document.querySelector('#botaoSenha');
        const campoSenha = document.querySelector('#campoSenha');
        const mensagem = document.querySelector('#mensagem');
        const mensagemSenha = document.querySelector('#mensagemSenha');

        botaoSim.addEventListener('click', () => {
            telaPergunta.style.display = 'none';
            telaSenha.classList.add('visivel');
            campoSenha.focus();
        });

        botaoNao.addEventListener('click', () => {
            mensagem.textContent = 'Pense com carinho e tente novamente. ❤️';
        });

        botaoSenha.addEventListener('click', () => {
            const senhaCorreta = 'COLOQUE_A_SENHA_AQUI';

            if (campoSenha.value === senhaCorreta) {
                localStorage.setItem(
                    'inicioDoNossoAmor',
                    new Date().toISOString()
                );

                window.location.href = 'tempo-juntos.html';
                return;
            }

            mensagemSenha.textContent = 'Senha incorreta. Tente novamente.';
            campoSenha.value = '';
            campoSenha.focus();
        });
    </script>


</body>
</html>
